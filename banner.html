<title>The Krebs Run · Extra Credit</title>
<meta name="description" content="Animated banner for The Krebs Run, an extra-credit citric acid cycle game.">
<!-- Models, lightened for the web: the Millennium Falcon, the Death Star and the TIE fighter, all supplied by the course author
     (the Death Star's and TIE fighter's downloads did not record an author or licence). The forest moon, asteroids, gates and
     effects are drawn in code. three.js (MIT). Unofficial fan learning game, not affiliated with Lucasfilm or Disney. -->

<style>
/* Built like The Battle of Embden's banner: real words on the left, the scene behind and to the right.
   Colours are the game's: deep-space ink, cyan readouts and gold. */
:root {
  --ink: #03060d;
  --gold: #ffc24d;
  --cyan: #3bdbeb;
  --green: #57e0a6;
  --white: #eef7f8;
  --muted: #b3c8cc;
  --f-ui: 'Inter', 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--white); font-family: var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(120% 140% at 70% 40%, #0a1424 0%, var(--ink) 70%); }
/* the poster shows until the 3D scene is ready, and stays if it can't run */
#poster { position: absolute; inset: 0; background: url(banner_poster.jpg) center / cover no-repeat; opacity: 0; transition: opacity 0.6s ease; }
body.poster #poster { opacity: 1; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 1.2s ease; }
body.live #c { opacity: 1; }
/* darken behind the words so they stay readable over the scene */
#scrim { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, rgba(3,6,13,0.94) 0%, rgba(3,6,13,0.86) 28%, rgba(3,6,13,0.42) 48%, rgba(3,6,13,0) 62%),
              linear-gradient(0deg, rgba(3,6,13,0.5) 0%, rgba(3,6,13,0) 24%); }
.corner { position: absolute; width: 22px; height: 22px; border: 0 solid rgba(255,194,77,0.6); pointer-events: none; }
.corner.tl { left: 12px; top: 12px; border-left-width: 2px; border-top-width: 2px; }
.corner.tr { right: 12px; top: 12px; border-right-width: 2px; border-top-width: 2px; }
.corner.bl { left: 12px; bottom: 12px; border-left-width: 2px; border-bottom-width: 2px; }
.corner.br { right: 12px; bottom: 12px; border-right-width: 2px; border-bottom-width: 2px; }
#copy { position: absolute; left: clamp(22px, 4.2vw, 48px); top: 50%; transform: translateY(-50%); width: min(44%, 450px); }
.eyebrow { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: clamp(12px, 1.45vw, 14px);
  letter-spacing: 0.2em; color: var(--gold); text-transform: uppercase; }
.eyebrow .pts { color: var(--ink); background: var(--gold); padding: 4px 8px 3px; letter-spacing: 0.1em; border-radius: 2px; font-weight: 800; }
h1 { margin: 12px 0 0; font-weight: 800; line-height: 0.92; letter-spacing: -0.01em; text-transform: uppercase; }
h1 .the { display: block; font-size: clamp(14px, 2vw, 20px); font-weight: 700; letter-spacing: 0.3em; color: var(--cyan); margin-bottom: 8px; }
h1 .big { display: block; font-size: clamp(36px, 6.6vw, 68px); color: #fff; letter-spacing: 0.01em; text-shadow: 0 2px 0 rgba(0,0,0,0.45), 0 0 30px rgba(59,219,235,0.25); }
.lede { margin: 14px 0 0; font-size: clamp(14px, 1.7vw, 17px); line-height: 1.45; color: var(--white); max-width: 30em; text-shadow: 0 1px 8px rgba(0,0,0,0.85); }
.lede b { color: var(--gold); font-weight: 700; }
.cta { margin-top: clamp(14px, 2.3vw, 22px); display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; }
.btn { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; font-size: clamp(14px, 1.6vw, 16px);
  letter-spacing: 0.08em; color: var(--ink); background: var(--gold); text-decoration: none; padding: 12px 18px 11px; border-radius: 3px;
  box-shadow: 0 0 0 1px rgba(255,194,77,0.4), 0 6px 22px rgba(0,0,0,0.35); transition: transform 0.15s ease, background 0.15s ease; }
.btn:hover { background: #ffd47a; transform: translateY(-1px); }
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.btn svg { width: 16px; height: 16px; }
.meta { font-size: clamp(12px, 1.35vw, 14px); color: var(--muted); }
#hud { position: absolute; right: 22px; bottom: 18px; display: flex; align-items: center; gap: 9px; font-weight: 700;
  font-size: 12px; letter-spacing: 0.18em; color: var(--white); text-shadow: 0 1px 6px #000, 0 0 2px #000; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
body.live #hud { opacity: 1; }
#hud .blip { width: 8px; height: 8px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: blink 1.1s steps(2, start) infinite; }
#hud.alert .blip { background: #ff6a55; box-shadow: 0 0 10px #ff6a55; }
#hud.good .blip { background: var(--green); box-shadow: 0 0 10px var(--green); }
/* the NADH fuel gauge, as on the game's flight screen */
#gauge { display: none; align-items: center; gap: 7px; margin-right: 6px; color: var(--gold); }
#gauge.on { display: inline-flex; }
#gauge .bar { position: relative; width: 66px; height: 7px; background: rgba(255,194,77,0.18); box-shadow: 0 0 0 1px rgba(255,194,77,0.35); }
#gauge i { position: absolute; left: 0; top: 0; bottom: 0; width: 33%; background: var(--gold); box-shadow: 0 0 8px rgba(255,194,77,0.7); }
@keyframes blink { to { visibility: hidden; } }
#copy > * { opacity: 0; transform: translateY(10px); animation: rise 0.7s cubic-bezier(.2,.7,.2,1) forwards; }
#copy > :nth-child(1) { animation-delay: 0.1s; }
#copy > :nth-child(2) { animation-delay: 0.22s; }
#copy > :nth-child(3) { animation-delay: 0.36s; }
#copy > :nth-child(4) { animation-delay: 0.5s; }
@keyframes rise { to { opacity: 1; transform: none; } }
/* narrow (a phone, or a thin course column): words on top, the action underneath */
@media (max-aspect-ratio: 5/4) {
  #scrim { background: linear-gradient(180deg, rgba(3,6,13,0.95) 0%, rgba(3,6,13,0.86) 42%, rgba(3,6,13,0.3) 60%, rgba(3,6,13,0) 70%); }
  #copy { top: clamp(18px, 5vw, 30px); transform: none; width: auto; right: 22px; }
  h1 { margin-top: 8px; }
  h1 .big { font-size: clamp(30px, 9.5vw, 50px); }
  h1 .the { font-size: clamp(12px, 3.5vw, 17px); margin-bottom: 5px; }
  .eyebrow { font-size: clamp(11px, 3vw, 14px); }
  .lede { font-size: clamp(13px, 3.6vw, 16px); line-height: 1.4; margin-top: 10px; }
  .cta { margin-top: 12px; gap: 8px 10px; }
  .btn { font-size: clamp(12px, 3.4vw, 15px); padding: 10px 13px 9px; }
  .meta { font-size: clamp(11px, 2.9vw, 13px); }
  #hud { display: none; }
}
@media (max-height: 300px) and (min-aspect-ratio: 5/4) { .lede { display: none; } }
@media (prefers-reduced-motion: reduce) { #copy > * { animation: none; opacity: 1; transform: none; } #hud .blip { animation: none; } #c, #poster, #hud { transition: none; } }
</style>

<div id="stage">

  <main id="copy">

    <div class="cta">

        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg></a>

</div>

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<script>
  // If WebGL isn't available (or the 3D scene never gets going), the still picture is shown instead.
  setTimeout(() => { if (!document.body.classList.contains('live')) document.body.classList.add('poster'); }, 9000);
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

const V3 = THREE.Vector3;
const Y = new V3(0, 1, 0);
const params = new URLSearchParams(location.search);
const CAPTURE = params.has('capture');   // test/recording mode: time only advances when asked
const STILL = !CAPTURE && matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rand = mulberry(20261016);
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
// the game's colours (KrebsGame.cs): gates A, B and C, and the green of a correct gate
const LANE = [srgb(0.23, 0.86, 0.92), srgb(1, 0.76, 0.3), srgb(0.74, 0.6, 1)], GREEN = srgb(0.34, 0.88, 0.65);
const INK = srgb(0.012, 0.024, 0.05);

// ---------- renderer, scene, camera ----------
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: CAPTURE });
} catch (err) { document.body.classList.add('poster'); throw err; }
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
scene.background = INK.clone();
const camera = new THREE.PerspectiveCamera(30, 2, 0.3, 4000);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.25;
// The sun is off to the left and a little toward the camera, so the Death Star's sunlit half faces the words and its night
// side, with the window lights, faces right, as in the game.
const SUN = new V3(-0.8, 0.35, 0.45).normalize();
const sun = new THREE.DirectionalLight(srgb(1, 0.96, 0.88), 2.6);
sun.position.copy(SUN).multiplyScalar(1000);
scene.add(sun, sun.target, new THREE.HemisphereLight(srgb(0.45, 0.55, 0.7), srgb(0.05, 0.05, 0.07), 0.25));

// ---------- textures drawn in code ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function radial(stops, size = 128) {
  return canvasTex(size, size, (x, w) => {
    const g = x.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
    for (const [o, col] of stops) g.addColorStop(o, col);
    x.fillStyle = g; x.fillRect(0, 0, w, w);
  });
}
const TEX = {
  blue: radial([[0, 'rgba(230,248,255,1)'], [0.3, 'rgba(120,205,255,0.7)'], [1, 'rgba(0,0,0,0)']], 64),
  green: radial([[0, 'rgba(235,255,245,1)'], [0.3, 'rgba(87,224,166,0.7)'], [1, 'rgba(0,0,0,0)']], 64),
  star: radial([[0, 'rgba(255,255,255,1)'], [0.35, 'rgba(220,235,255,0.7)'], [1, 'rgba(0,0,0,0)']], 32),
};
const additive = (map, color = 0xffffff) => new THREE.SpriteMaterial({ map, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, toneMapped: false, fog: false });
// The forest moon: deep green forest with darker ridges, a few lakes, and swirls of cloud.
const moonTex = canvasTex(1024, 512, (x, w, h) => {
  const r = mulberry(5); x.fillStyle = '#24482a'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) { const g = 60 + r() * 70; x.fillStyle = r() < 0.6 ? `rgba(${g * 0.35 | 0},${g | 0},${g * 0.4 | 0},0.35)` : `rgba(${g * 0.25 | 0},${g * 0.55 | 0},${g * 0.3 | 0},0.4)`; x.beginPath(); x.ellipse(r() * w, r() * h, 3 + r() * 26, 2 + r() * 12, r() * 3, 0, 6.3); x.fill(); }
  for (let i = 0; i < 26; i++) { x.fillStyle = `rgba(40,80,120,${0.5 + r() * 0.3})`; x.beginPath(); x.ellipse(r() * w, h * (0.2 + r() * 0.6), 6 + r() * 30, 3 + r() * 12, r() * 3, 0, 6.3); x.fill(); }
  for (let i = 0; i < 260; i++) { x.fillStyle = `rgba(235,242,245,${0.12 + r() * 0.3})`; x.beginPath(); x.ellipse(r() * w, r() * h, 10 + r() * 60, 2 + r() * 7, (r() - 0.5) * 0.5, 0, 6.3); x.fill(); }
});
function letterTex(ch, color) {
  return canvasTex(128, 128, (x, w) => { x.font = '800 92px Inter, "Segoe UI", Arial, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#' + color.getHexString(THREE.SRGBColorSpace); x.shadowColor = x.fillStyle; x.shadowBlur = 14; x.fillText(ch, w / 2, w / 2 + 4); });
}

// A soft edge glow for spheres: the shield and the moon's air.
function rimMaterial(color, power, strength) {
  return new THREE.ShaderMaterial({
    uniforms: { uColor: { value: color.clone() }, uPower: { value: power }, uStrength: { value: strength } },
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 uColor; uniform float uPower; uniform float uStrength; varying vec3 vN; varying vec3 vV; void main() { float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), uPower); gl_FragColor = vec4(uColor * f * uStrength, 1.0); }',
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
}

// ---------- the shots ----------
// Five places in one stretch of space, one for each shot, far apart. Each is laid out in its own frame: the camera near the
// origin, looking down -Z. The order is the game's: the climb from the moon (the opening), the Death Star's shield going
// down, a gate on a lap of the cycle, the TIE fighters, and the jump to hyperspace (the ending).
const SHOTS = [
  { name: 'climb', base: new V3(0, 0, 0), dur: 4.2 },
  { name: 'station', base: new V3(6000, 0, 0), dur: 3.4 },
  { name: 'gates', base: new V3(12000, 0, 0), dur: 5.4 },
  { name: 'ties', base: new V3(18000, 0, 0), dur: 3.0 },
  { name: 'jump', base: new V3(24000, 0, 0), dur: 4.0 },
];
let acc = 0; for (const S of SHOTS) { S.start = acc; acc += S.dur; }
const LOOP = acc;
const SH = Object.fromEntries(SHOTS.map(s => [s.name, s]));
const W = (S, x, y, z, out = new V3()) => out.set(x, y, z).add(S.base);

// stars: a far sky that travels with the camera
const sky = (() => {
  const n = 2600, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), r = mulberry(11);
  for (let i = 0; i < n; i++) {
    const v = new V3(r() * 2 - 1, r() * 2 - 1, r() * 2 - 1).normalize().multiplyScalar(2600);
    pos.set([v.x, v.y, v.z], i * 3); const b = 0.35 + r() * 0.65, warm = r();
    col.set([b * (0.85 + 0.15 * warm), b * 0.92, b * (1.05 - 0.15 * warm)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ map: TEX.star, size: 2.2, sizeAttenuation: false, vertexColors: true, transparent: true, depthWrite: false, toneMapped: false, fog: false }));
  p.frustumCulled = false; scene.add(p); return p;
})();

// the forest moon, low in the first shot
const moon = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1, metalness: 0, envMapIntensity: 0.1 }));
moon.rotation.set(1.35, 0.6, 0.2); moon.scale.setScalar(190);   // a pole turned away, so the camera sees forest, not a pinwheel
const moonAir = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), rimMaterial(srgb(0.45, 0.75, 1), 3.2, 1.1));
moonAir.scale.setScalar(194);
W(SH.climb, 60, -205, -260, moon.position); moonAir.position.copy(moon.position);
scene.add(moon, moonAir);

// asteroids, made in code as in the game: lumpy, faceted, slowly tumbling
const rockGeos = [0, 1, 2, 3, 4].map(k => {
  const g = new THREE.IcosahedronGeometry(1, 2), p = g.attributes.position, v = new V3(), s = k * 1.7 + 0.4;
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const d = 1 + 0.24 * Math.sin(3.1 * v.x + s) * Math.sin(2.7 * v.y + 2 * s) * Math.sin(3.3 * v.z + 3 * s) + 0.09 * Math.sin(7.3 * v.x + 5 * s) * Math.sin(6.1 * v.z + s);
    v.multiplyScalar(d); v.set(v.x * (1 + 0.15 * k % 0.4), v.y * 0.82, v.z * 0.74); p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals(); return g;
});
const rockMats = [srgb(0.4, 0.37, 0.34), srgb(0.33, 0.32, 0.31), srgb(0.46, 0.41, 0.35)].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0, flatShading: true, envMapIntensity: 0.15 }));
const ROCKS = [];
function rock(S, at, size, drift) {
  const r = rand, m = new THREE.Mesh(rockGeos[Math.floor(r() * 5)], rockMats[Math.floor(r() * 3)]);
  m.scale.setScalar(size); scene.add(m);
  ROCKS.push({ S, m, at: at.clone(), drift: drift || new V3(), axis: new V3(r() - 0.5, r() - 0.5, r() - 0.5).normalize(), spin: 0.2 + r() * 0.5, phase: r() * 6 });
}
// the climb: some close by, drifting across, and more along the way up
rock(SH.climb, new V3(-3, 3, -14), 0.9, new V3(-2.2, 0.3, 0.8));
rock(SH.climb, new V3(18, 4, -36), 1.6, new V3(-1.2, 0.4, 2));
rock(SH.climb, new V3(11, 13, -70), 2.2, new V3(-0.6, -0.4, 1.2));
for (let i = 0; i < 10; i++) rock(SH.climb, new V3(-20 + rand() * 75, -2 + rand() * 30, -50 - rand() * 120), 0.8 + rand() * 2.4, new V3((rand() - 0.5) * 2, (rand() - 0.5), rand() * 2));
// out beside the lanes and high in the corners, never among the gates
for (const S of [SH.gates, SH.ties]) for (let i = 0; i < 16; i++) {
  const side = i % 2 ? 1 : -1, z = -20 - rand() * 220;
  rock(S, new V3(side * (24 + rand() * 50 + 0.25 * -z), i % 4 < 2 ? -6 + rand() * 14 : 18 + rand() * 30, z), 1.2 + rand() * 3.5, new V3(0, 0, 0));
}

// ---------- models ----------
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
// The models are stored scrambled (Tools/banner/lite_models.mjs), so none of the published files is a loose model file.
const KEY = 0x6b2f91d7;
async function unpack(url) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status);
  const b = new Uint8Array(await r.arrayBuffer()); let x = KEY;
  for (let i = 0; i < b.length; i++) { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; b[i] ^= x & 255; }
  return b.buffer;
}
const load = url => unpack(url).then(buf => new Promise((res, rej) => loader.parse(buf, '', res, rej)));
// Scale a model so its length (or height) is 1 and centre it; each shot then sizes it with obj.scale.
function fit(root, by = 'xz') {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root, true), dims = box.getSize(new V3()), c = box.getCenter(new V3());
  const k = 1 / (by === 'y' ? dims.y : Math.max(dims.x, dims.z));
  root.position.set(-c.x, -c.y, -c.z);
  const holder = new THREE.Group(); holder.add(root); holder.scale.setScalar(k);
  const outer = new THREE.Group(); outer.add(holder); scene.add(outer);
  return { obj: outer, holder, dims: dims.multiplyScalar(k) };
}
